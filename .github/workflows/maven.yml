name: JUnit CI/CD Pipeline
# Trigger workflow on push and pull requests to main
on:
push:
branches: [&quot;main&quot;]
pull_request:
branches: [&quot;main&quot;]

jobs:
# JOB 1: Execute JUnit Tests
junit-test:
runs-on: ubuntu-latest
steps:
# Step 1: Checkout source code
- name: Checkout source code
uses: actions/checkout@v4
# Step 2: Set up JDK 17
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: &#39;temurin&#39;
java-version: &#39;17&#39;
cache: maven
# Step 3: Verify Java and Maven
- name: Verify Java and Maven
run: |
java -version
mvn -version
# Step 4: Run JUnit tests
- name: Run JUnit tests
run: mvn clean test
# JOB 2: Build and Publish Docker Image
# Runs only after successful JUnit tests
build-and-publish-docker:
needs: junit-test
runs-on: ubuntu-latest
# Publish only on push events
if: github.event_name == &#39;push&#39;
steps:
# Step 1: Checkout source code
- name: Checkout source code
uses: actions/checkout@v4
# Step 2: Login to Docker Hub
- name: Login to Docker Hub
uses: docker/login-action@v3
with:
username: ${{ secrets.DOCKERHUB_USERNAME }}
password: ${{ secrets.DOCKERHUB_TOKEN }}
# Step 3: Set up Docker Buildx
- name: Set up Docker Buildx
uses: docker/setup-buildx-action@v3
# Step 4: Build and Push Docker Image
- name: Build and Push Docker Image
uses: docker/build-push-action@v6
with:
context: .
file: ./Dockerfile
push: true
tags: |

${{ secrets.DOCKERHUB_USERNAME }}/maven-project2:latest
${{ secrets.DOCKERHUB_USERNAME }}/maven-project2:${{ github.sha }}
